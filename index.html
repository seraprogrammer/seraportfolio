<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio - John Doe (Dark Glassmorphism)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      /* Global Styles - Dark Mode */
      :root {
        --primary-color: #00e5ff; /* Bright Cyan - Kept for contrast */
        --secondary-color: #cfd8dc; /* Lighter Grey - Was text-muted */
        --text-color: #e0e0e0; /* Light Grey / Off-White */
        --text-muted: #90a4ae; /* Medium Grey */
        --bg-url: "https://images.unsplash.com/photo-1587691592099-f93b6075c91a?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1740&q=80"; /* Abstract Background Image */

        /* Dark Glass Effect */
        --glass-bg: rgba(
          10,
          10,
          15,
          0.65
        ); /* Dark semi-transparent background */
        --glass-border: rgba(255, 255, 255, 0.1); /* Subtle light border */
        --glass-shadow: rgba(0, 0, 0, 0.25); /* Slightly stronger dark shadow */
        --glass-blur: 10px;

        --input-bg: rgba(0, 0, 0, 0.2); /* Dark input background */
        --input-focus-bg: rgba(0, 0, 0, 0.3);
        --input-border: rgba(255, 255, 255, 0.1);

        --border-radius: 1rem;
        --font-family: "Poppins", sans-serif;
        --transition: all 0.3s ease-in-out;
      }

      body {
        font-family: var(--font-family);
        font-size: 1rem;
        color: var(--text-color);
        background: #01010a;
        background-size: cover;
        margin: 0;
        padding: 2rem;
        line-height: 1.7;
        overflow-x: hidden;
        min-height: 100vh;
        padding-top: 4.5rem;
        background-image: linear-gradient(120deg, #01010a 60%, #11131a 100%);
      }

      /* Dark Glass Effect Utility Class */
      .glass-effect {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur)); /* For Safari */
        border-radius: var(--border-radius);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 var(--glass-shadow);
        padding: 2rem;
        margin-bottom: 3rem;
        transition: var(--transition);
      }

      .glass-effect:hover {
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.35); /* Slightly stronger shadow on hover */
        transform: translateY(-5px);
        border-color: rgba(
          255,
          255,
          255,
          0.15
        ); /* Slightly brighter border on hover */
      }

      /* Typography */
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: var(--text-color);
        font-weight: 600;
        line-height: 1.3;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 3.7rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #fff;
        text-shadow: 0 0 12px #00e5ff99, 0 2px 12px #000a;
        margin-bottom: 0.5rem;
      }

      h2 {
        font-size: 2.5rem;
        margin-bottom: 2.5rem;
        text-align: center;
        position: relative;
        padding-bottom: 0.75rem;
      }

      h2::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 5rem;
        height: 3px;
        background: linear-gradient(90deg, var(--primary-color), #00b8d4);
        border-radius: 3px;
      }

      a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
        transition: var(--transition);
      }

      a:hover {
        filter: brightness(1.2);
      }

      p {
        color: var(--text-muted);
      }

      /* Layout */
      .container {
        width: 90%;
        max-width: 1100px;
        margin: 0 auto;
      }

      /* Header */
      header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        padding: 4rem 2rem;
        margin-bottom: 3rem;
        background: transparent;
        box-shadow: none;
        border-radius: 0;
      }

      .hero-container {
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 2rem;
        width: 100%;
        max-width: 1200px;
      }

      .hero-card {
        background: #0c102d;
        border-radius: 0.75rem;
        box-shadow: 0 4px 32px 0 rgba(0, 0, 0, 0.3);
        padding: 2.5rem 2rem 2rem 2rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hero-avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 1.2rem;
      }

      .hero-intro {
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5;
        margin-bottom: 1.5rem;
        text-align: center;
      }

      .hero-socials {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .hero-socials a {
        color: #64ffda;
        font-size: 1.5rem;
        transition: transform 0.2s;
      }

      .hero-socials a:hover {
        transform: scale(1.15);
      }

      .hero-resume-btn {
        display: inline-block;
        background: transparent;
        color: #fff;
        font-weight: 500;
        font-size: 0.9rem;
        padding: 0.5rem 1.2rem;
        border-radius: 1.5rem;
        border: 2px solid #64ffda;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .hero-resume-btn:hover {
        background: rgba(100, 255, 218, 0.1);
      }

      /* Code snippet card styles */
      .code-card {
        background: #0c102d;
        border-radius: 0.75rem;
        box-shadow: 0 4px 32px 0 rgba(0, 0, 0, 0.3);
        padding: 0;
        width: 100%;
        max-width: 550px;
        overflow: hidden;
      }

      .code-header {
        background: #161b36;
        padding: 0.6rem 1rem;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #222843;
      }

      .code-dots {
        display: flex;
        gap: 0.4rem;
      }

      .code-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .dot-red {
        background: #ff5f56;
      }
      .dot-yellow {
        background: #ffbd2e;
      }
      .dot-green {
        background: #27c93f;
      }

      .code-content {
        padding: 1.5rem;
        font-family: monospace;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #fff;
        text-align: left;
      }

      .code-keyword {
        color: #ff79c6;
      }
      .code-var {
        color: #bd93f9;
      }
      .code-string {
        color: #50fa7b;
      }
      .code-number {
        color: #bd93f9;
      }
      .code-comment {
        color: #6272a4;
      }
      .code-boolean {
        color: #ff5555;
      }

      @media (max-width: 768px) {
        .hero-container {
          flex-direction: column;
          align-items: center;
        }

        .hero-card,
        .code-card {
          max-width: 100%;
        }
      }

      /* Sections */
      section {
        animation: fadeInUp 1s ease-out forwards;
        opacity: 0; /* Start hidden for animation */
      }

      /* Staggered Animation Delay */
      section:nth-of-type(1) {
        animation-delay: 0.2s;
      }
      section:nth-of-type(2) {
        animation-delay: 0.4s;
      }
      section:nth-of-type(3) {
        animation-delay: 0.6s;
      }

      /* Updated About Section Styles */
      #about.glass-effect {
        background: #0c102d;
        border-radius: 0.75rem;
        border: none;
        overflow: hidden;
        position: relative;
      }

      #about::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(90deg, #64ffda, #00b8d4);
      }

      #about .about-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      #about h2 {
        color: #fff;
        font-size: 2.2rem;
        margin-bottom: 2rem;
      }

      #about h2::after {
        background: linear-gradient(90deg, #64ffda, #00b8d4);
        height: 4px;
        width: 5rem;
      }

      .about-text {
        max-width: 700px;
        margin-bottom: 1.5rem;
        font-size: 1.05rem;
        line-height: 1.7;
        position: relative;
        color: #b4c3d5;
      }

      .about-highlights {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.2rem;
        margin: 1.5rem 0;
      }

      .highlight-item {
        background: rgba(100, 255, 218, 0.1);
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: #64ffda;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .toggle-bio-button {
        background: transparent;
        border: 2px solid #64ffda;
        color: #64ffda;
        padding: 0.5rem 1.5rem;
        border-radius: 2rem;
        cursor: pointer;
        font-weight: 500;
        margin-top: 1.5rem;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 0.9rem;
      }

      .toggle-bio-button:hover {
        background: rgba(100, 255, 218, 0.1);
      }

      /* Skills Section */
      .skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
      }

      .skill {
        background: rgba(22, 27, 54, 0.6);
        border-radius: 0.75rem;
        padding: 1.8rem 1.5rem;
        text-align: center;
        transition: all 0.3s ease;
        border: 1px solid rgba(100, 255, 218, 0.1);
        position: relative;
        overflow: hidden;
      }

      .skill:hover {
        transform: translateY(-8px);
        border-color: rgba(100, 255, 218, 0.3);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      .skill-icon {
        color: #64ffda;
        font-size: 2rem;
        margin-bottom: 1rem;
        display: block;
      }

      .skill h3 {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #fff;
      }

      .skill-bar {
        height: 8px;
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        overflow: hidden;
        margin-top: 1rem;
        position: relative;
      }

      .skill-level {
        height: 100%;
        background: linear-gradient(90deg, #64ffda, #00b8d4);
        width: 0;
        border-radius: 8px;
        transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        position: relative;
      }

      .skill-percent {
        position: absolute;
        top: -25px;
        right: 0;
        font-size: 0.85rem;
        color: #64ffda;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .skill:hover .skill-percent {
        opacity: 1;
      }

      /* Projects Section */
      #projects {
        padding: 5rem 0;
      }

      .section-title {
        font-size: 2.5rem;
        text-align: center;
        margin-bottom: 3rem;
        color: var(--primary-color);
        font-weight: 700;
        position: relative;
      }

      .section-title::after {
        content: "";
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: var(--primary-color);
      }

      .projects-container {
        max-width: 1200px;
      }

      .projects-list {
        display: flex;
        flex-direction: column;
        gap: 6rem;
      }

      .project-card {
        position: relative;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        height: 350px;
      }

      .project-inner {
        display: flex;
        height: 100%;
      }

      .project-content {
        flex: 1;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        z-index: 2;
      }

      .project-number {
        font-size: 5rem;
        font-weight: 800;
        color: rgba(100, 255, 218, 0.1);
        position: absolute;
        top: 0;
        left: 0;
        line-height: 1;
      }

      .project-card h3 {
        color: white;
        font-weight: 700;
        font-size: 1.8rem;
        margin: 1rem 0;
        position: relative;
      }

      .project-card p {
        margin: 1.5rem 0;
        color: var(--text-muted);
        line-height: 1.7;
        font-size: 1rem;
        max-width: 90%;
      }

      .project-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .project-tag {
        background: rgba(100, 255, 218, 0.1);
        color: var(--primary-color);
        padding: 0.4rem 1rem;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .project-image-wrapper {
        flex: 1;
        position: relative;
      }

      .project-image-container {
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.3);
      }

      .project-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(20%) contrast(1);
        transition: all 0.4s ease;
      }

      .project-card:hover .project-image {
        filter: grayscale(0%) contrast(1.1);
        transform: scale(1.05);
      }

      .project-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
        margin-top: 1.5rem;
        transition: all 0.3s ease;
        width: fit-content;
      }

      .project-link i {
        font-size: 0.9rem;
        transition: transform 0.3s ease;
      }

      .project-link:hover {
        color: white;
      }

      .project-link:hover i {
        transform: translateX(5px);
      }

      /* Alternate layout for even-numbered projects */
      .project-card:nth-child(even) .project-inner {
        flex-direction: row-reverse;
      }

      .project-card:nth-child(even) .project-content {
        text-align: right;
        align-items: flex-end;
      }

      .project-card:nth-child(even) .project-number {
        right: 0;
        left: auto;
      }

      .project-card:nth-child(even) p {
        margin-left: auto;
      }

      @media (max-width: 992px) {
        .project-card {
          height: auto;
        }

        .project-inner {
          flex-direction: column-reverse !important;
        }

        .project-card:nth-child(even) .project-content {
          text-align: left;
          align-items: flex-start;
        }

        .project-card:nth-child(even) .project-number {
          left: 0;
          right: auto;
        }

        .project-card:nth-child(even) p {
          margin-left: 0;
          margin-right: auto;
        }

        .project-content,
        .project-image-wrapper {
          width: 100%;
        }

        .project-image-wrapper {
          height: 250px;
        }

        .project-image-container {
          position: relative;
        }
      }

      /* Contact Section */
      .contact-section {
        background: linear-gradient(
          180deg,
          var(--glass-bg),
          rgba(10, 10, 20, 0.9)
        );
      }

      .contact-subtitle {
        text-align: center;
        color: var(--text-muted);
        margin: -2rem auto 3rem;
        max-width: 650px;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .contact-container {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 3rem;
        align-items: start;
      }

      .contact-info {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .contact-card {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
        padding: 1.5rem;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .contact-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(0, 229, 255, 0.2);
      }

      .contact-card i {
        font-size: 1.75rem;
        color: var(--primary-color);
        margin-bottom: 1rem;
        display: block;
      }

      .contact-card h3 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: white;
      }

      .contact-card p {
        color: var(--text-muted);
        font-size: 1rem;
      }

      .contact-socials {
        display: flex;
        justify-content: flex-start;
        gap: 1.25rem;
        margin-top: 1rem;
      }

      .contact-socials a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-color);
        font-size: 1.25rem;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .contact-socials a:hover {
        color: var(--primary-color);
        background: rgba(0, 229, 255, 0.1);
        transform: translateY(-3px);
        border-color: var(--primary-color);
      }

      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .form-group {
        position: relative;
      }

      .form-group.active label {
        color: var(--primary-color);
      }

      .form-group label {
        display: block;
        margin-bottom: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
        transition: color 0.3s ease;
      }

      .input-container {
        position: relative;
        background-color: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--input-border);
        border-radius: 10px;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .form-group.active .input-container {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
        background-color: rgba(0, 0, 0, 0.3);
      }

      .input-container i {
        position: absolute;
        left: 1.25rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 1.1rem;
        transition: color 0.3s ease;
      }

      .textarea-container i {
        top: 1.5rem;
        transform: none;
      }

      .form-group.active .input-container i {
        color: var(--primary-color);
      }

      .contact-form input,
      .contact-form textarea {
        width: 100%;
        background: transparent;
        border: none;
        padding: 1rem 1rem 1rem 3.5rem;
        color: var(--text-color);
        font-size: 1rem;
        font-family: var(--font-family);
      }

      .contact-form textarea {
        min-height: 150px;
        resize: vertical;
        padding-top: 1.25rem;
      }

      .contact-form input:focus,
      .contact-form textarea:focus {
        outline: none;
      }

      .contact-form input::placeholder,
      .contact-form textarea::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .submit-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1rem 1.5rem;
        background: linear-gradient(90deg, var(--primary-color), #00b8d4);
        color: #111;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        margin-top: 1rem;
        position: relative;
        overflow: hidden;
        z-index: 1;
      }

      .submit-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #00b8d4, var(--primary-color));
        transition: left 0.6s ease;
        z-index: -1;
      }

      .submit-button:hover {
        box-shadow: 0 5px 15px rgba(0, 229, 255, 0.3);
        transform: translateY(-3px);
      }

      .submit-button:hover::before {
        left: 0;
      }

      .success-message {
        max-width: 450px;
        margin: 2rem auto;
        text-align: center;
        padding: 3rem 2rem;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 15px;
        border: 1px solid rgba(0, 229, 255, 0.2);
        animation: fadeIn 0.6s ease;
      }

      .success-icon {
        font-size: 4rem;
        color: var(--primary-color);
        margin-bottom: 1.5rem;
      }

      .success-message h3 {
        font-size: 1.75rem;
        margin-bottom: 1rem;
        color: white;
      }

      .success-message p {
        color: var(--text-muted);
        margin-bottom: 2rem;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .reset-button {
        background: transparent;
        color: var(--primary-color);
        border: 1px solid var(--primary-color);
        padding: 0.75rem 1.5rem;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .reset-button:hover {

      function NavBar() {
        // Optional: highlight active link on scroll
        setEffect(() => {
          const links = document.querySelectorAll("nav .nav-links a");
          const sections = ["about", "skills", "projects", "contact"].map(
            (id) => document.getElementById(id)
          );

          function onScroll() {
            const scrollPos = window.scrollY + 80; // Offset for fixed nav
            let activeIdx = 0;
            sections.forEach((section, idx) => {
              if (section && section.offsetTop <= scrollPos) {
                activeIdx = idx;
              }
            });
            links.forEach((link, idx) => {
              if (idx === activeIdx) {
                link.classList.add("active");
              } else {
                link.classList.remove("active");
              }
            });
          }
          window.addEventListener("scroll", onScroll, { passive: true });
          onScroll();
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        return h(
          "nav",
          null,
          h(
            "div",
            { class: "nav-container" },
